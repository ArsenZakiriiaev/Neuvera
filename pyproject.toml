[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuvera-ai"
version = "0.1.0"
description = "Hackathon-friendly AI analysis pipeline for Neuvera."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11"
]

[project.optional-dependencies]
audio = [
  "librosa>=0.10"
]
video = [
  "opencv-python>=4.9",
  "mediapipe>=0.10"
]
dev = [
  "pytest>=8.0"
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["neuvera_ai*"]
